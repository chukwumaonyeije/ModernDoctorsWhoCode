name: Regenerate Blog Audio

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/blog/posts/*.md'
      - 'src/content/blog/posts/*.mdx'
      - 'scripts/generate_audio.py'
      - '.github/workflows/regenerate-blog-audio.yml'
  workflow_dispatch:
    inputs:
      slugs:
        description: "Optional newline-separated blog post slugs to regenerate. Leave blank to generate audio for all published posts missing audio."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  regenerate-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio generation dependencies
        run: pip install openai python-frontmatter python-dotenv

      - name: Regenerate selected audio files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUDIO_SLUGS: ${{ inputs.slugs }}
        run: |
          if [ -z "$(printf "%s" "$AUDIO_SLUGS" | tr -d '[:space:]')" ]; then
            python scripts/generate_audio.py --missing
          else
            while IFS= read -r slug; do
              if [ -n "$slug" ]; then
                python scripts/generate_audio.py --force --slug "$slug"
              fi
            done <<< "$AUDIO_SLUGS"
          fi

      - name: Commit regenerated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio src/content/blog/posts
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
            exit 0
          fi
          git commit -m "Regenerate selected blog audio"
          git push
