<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Your First Week on GitHub as a Physician</title>
  <desc id="desc">Seven day columns showing a physician's GitHub activity growing across the week, from empty to a glowing completed repository with commit history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06111F"/>
      <stop offset="0.5" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 500) scale(700 450)">
      <stop stop-color="#0EA5E9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1350 450) scale(380 480)">
      <stop stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#1D4ED8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="barGrad7" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="160" y1="760" x2="1440" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="barGlow" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.22"/>
  <ellipse cx="800" cy="500" rx="700" ry="450" fill="url(#glowCenter)"/>
  <ellipse cx="1350" cy="450" rx="380" ry="480" fill="url(#glowRight)"/>

  <!-- Baseline / floor -->
  <line x1="160" y1="720" x2="1440" y2="720" stroke="#1E293B" stroke-width="2"/>

  <!-- Day labels -->
  <text x="220" y="760" font-family="JetBrains Mono, monospace" font-size="22" fill="#38BDF8" fill-opacity="0.5" text-anchor="middle">MON</text>
  <text x="400" y="760" font-family="JetBrains Mono, monospace" font-size="22" fill="#38BDF8" fill-opacity="0.55" text-anchor="middle">TUE</text>
  <text x="580" y="760" font-family="JetBrains Mono, monospace" font-size="22" fill="#38BDF8" fill-opacity="0.6" text-anchor="middle">WED</text>
  <text x="760" y="760" font-family="JetBrains Mono, monospace" font-size="22" fill="#38BDF8" fill-opacity="0.65" text-anchor="middle">THU</text>
  <text x="940" y="760" font-family="JetBrains Mono, monospace" font-size="22" fill="#38BDF8" fill-opacity="0.75" text-anchor="middle">FRI</text>
  <text x="1120" y="760" font-family="JetBrains Mono, monospace" font-size="22" fill="#38BDF8" fill-opacity="0.85" text-anchor="middle">SAT</text>
  <text x="1300" y="760" font-family="JetBrains Mono, monospace" font-size="22" fill="#67E8F9" text-anchor="middle">SUN</text>

  <!-- Day 1 bar: very small — account setup -->
  <rect x="185" y="660" width="70" height="60" rx="6" fill="#1D4ED8" fill-opacity="0.2" stroke="#1D4ED8" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="185" y="678" width="70" height="10" rx="3" fill="#1D4ED8" fill-opacity="0.3"/>

  <!-- Day 2 bar: small — one repo -->
  <rect x="365" y="600" width="70" height="120" rx="6" fill="#1D4ED8" fill-opacity="0.25" stroke="#1D4ED8" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="365" y="614" width="70" height="10" rx="3" fill="#1D4ED8" fill-opacity="0.4"/>
  <rect x="365" y="630" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>

  <!-- Day 3 bar: medium — README -->
  <rect x="545" y="520" width="70" height="200" rx="6" fill="#1D4ED8" fill-opacity="0.32" stroke="#0EA5E9" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="545" y="534" width="70" height="10" rx="3" fill="#38BDF8" fill-opacity="0.4"/>
  <rect x="545" y="550" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>
  <rect x="545" y="564" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.5"/>

  <!-- Day 4 bar: medium-tall — first version -->
  <rect x="725" y="420" width="70" height="300" rx="6" fill="#0EA5E9" fill-opacity="0.3" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="725" y="434" width="70" height="10" rx="3" fill="#38BDF8" fill-opacity="0.5"/>
  <rect x="725" y="450" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>
  <rect x="725" y="464" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.5"/>
  <rect x="725" y="478" width="70" height="8" rx="3" fill="#0EA5E9" fill-opacity="0.3"/>

  <!-- Day 5 bar: tall — commits -->
  <rect x="905" y="330" width="70" height="390" rx="6" fill="#0EA5E9" fill-opacity="0.38" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.5"/>
  <rect x="905" y="344" width="70" height="10" rx="3" fill="#67E8F9" fill-opacity="0.55"/>
  <rect x="905" y="360" width="70" height="8" rx="3" fill="#38BDF8" fill-opacity="0.4"/>
  <rect x="905" y="374" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>
  <rect x="905" y="388" width="70" height="8" rx="3" fill="#0EA5E9" fill-opacity="0.35"/>
  <rect x="905" y="402" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.5"/>

  <!-- Day 6 bar: very tall — improvement -->
  <rect x="1085" y="230" width="70" height="490" rx="6" fill="#0EA5E9" fill-opacity="0.45" stroke="#67E8F9" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="1085" y="244" width="70" height="10" rx="3" fill="#67E8F9" fill-opacity="0.65"/>
  <rect x="1085" y="260" width="70" height="8" rx="3" fill="#38BDF8" fill-opacity="0.5"/>
  <rect x="1085" y="274" width="70" height="8" rx="3" fill="#67E8F9" fill-opacity="0.35"/>
  <rect x="1085" y="288" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>
  <rect x="1085" y="302" width="70" height="8" rx="3" fill="#0EA5E9" fill-opacity="0.4"/>
  <rect x="1085" y="316" width="70" height="8" rx="3" fill="#38BDF8" fill-opacity="0.3"/>

  <!-- Day 7 bar: full height — published -->
  <g filter="url(#barGlow)">
    <rect x="1265" y="140" width="70" height="580" rx="6" fill="#38BDF8" fill-opacity="0.55" stroke="#67E8F9" stroke-opacity="0.9" stroke-width="2"/>
  </g>
  <rect x="1265" y="154" width="70" height="10" rx="3" fill="#67E8F9" fill-opacity="0.9"/>
  <rect x="1265" y="170" width="70" height="8" rx="3" fill="#38BDF8" fill-opacity="0.7"/>
  <rect x="1265" y="184" width="70" height="8" rx="3" fill="#67E8F9" fill-opacity="0.5"/>
  <rect x="1265" y="198" width="70" height="8" rx="3" fill="#0EA5E9" fill-opacity="0.5"/>
  <rect x="1265" y="212" width="70" height="8" rx="3" fill="#38BDF8" fill-opacity="0.4"/>
  <rect x="1265" y="226" width="70" height="8" rx="3" fill="#1E293B" fill-opacity="0.5"/>
  <rect x="1265" y="240" width="70" height="8" rx="3" fill="#67E8F9" fill-opacity="0.35"/>

  <!-- Progress line connecting tops of bars -->
  <path d="M220 660 L400 600 L580 520 L760 420 L940 330 L1120 230 L1300 140" stroke="url(#cyanLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Dots at tops -->
  <g filter="url(#softGlow)">
    <circle cx="220" cy="660" r="7" fill="#1D4ED8"/>
    <circle cx="400" cy="600" r="7" fill="#1D4ED8"/>
    <circle cx="580" cy="520" r="7" fill="#38BDF8"/>
    <circle cx="760" cy="420" r="8" fill="#38BDF8"/>
    <circle cx="940" cy="330" r="8" fill="#67E8F9"/>
    <circle cx="1120" cy="230" r="9" fill="#67E8F9"/>
    <circle cx="1300" cy="140" r="11" fill="#67E8F9"/>
  </g>

  <!-- Activity labels on last bar -->
  <text x="1390" y="164" font-family="JetBrains Mono, monospace" font-size="18" fill="#67E8F9" fill-opacity="0.8">published</text>
  <text x="1390" y="188" font-family="JetBrains Mono, monospace" font-size="16" fill="#38BDF8" fill-opacity="0.6">7 commits</text>

  <!-- Small commit dot row (contribution graph) at top -->
  <g opacity="0.35">
    <rect x="160" y="82" width="1280" height="1" fill="#1E293B"/>
    <text x="160" y="72" font-family="JetBrains Mono, monospace" font-size="16" fill="#38BDF8" fill-opacity="0.4">contribution activity</text>
  </g>

  <!-- Decorative commit squares (GitHub-style contribution grid) -->
  <g opacity="0.55">
    <!-- Row of small squares suggesting contribution history -->
    <rect x="820" y="100" width="14" height="14" rx="3" fill="#1D4ED8" fill-opacity="0.4"/>
    <rect x="840" y="100" width="14" height="14" rx="3" fill="#0EA5E9" fill-opacity="0.5"/>
    <rect x="860" y="100" width="14" height="14" rx="3" fill="#38BDF8" fill-opacity="0.7"/>
    <rect x="880" y="100" width="14" height="14" rx="3" fill="#67E8F9" fill-opacity="0.9"/>
    <rect x="820" y="120" width="14" height="14" rx="3" fill="#1E293B" fill-opacity="0.5"/>
    <rect x="840" y="120" width="14" height="14" rx="3" fill="#1D4ED8" fill-opacity="0.35"/>
    <rect x="860" y="120" width="14" height="14" rx="3" fill="#0EA5E9" fill-opacity="0.55"/>
    <rect x="880" y="120" width="14" height="14" rx="3" fill="#38BDF8" fill-opacity="0.8"/>
  </g>

  <!-- Floor baseline sweep -->
  <path d="M80 790C340 760 640 760 800 780C960 800 1280 800 1520 760" stroke="url(#cyanLine)" stroke-opacity="0.15" stroke-width="2"/>
</svg>
