  <rect x="304" y="408" width="160" height="9" rx="3" fill="#38BDF8" fill-opacity="0.5"/>
  <rect x="148" y="425" width="80" height="9" rx="3" fill="#38BDF8" fill-opacity="0.5"/>
  <rect x="236" y="425" width="200" height="9" rx="3" fill="#1E293B" fill-opacity="0.6"/>
  <rect x="148" y="442" width="120" height="9" rx="3" fill="#A78BFA" fill-opacity="0.55"/>
