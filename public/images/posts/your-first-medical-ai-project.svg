  <rect x="148" y="459" width="80" height="9" rx="3" fill="#38BDF8" fill-opacity="0.45"/>
  <rect x="236" y="459" width="100" height="9" rx="3" fill="#67E8F9" fill-opacity="0.4"/>
  <rect x="148" y="476" width="240" height="9" rx="3" fill="#1E293B" fill-opacity="0.5"/>
