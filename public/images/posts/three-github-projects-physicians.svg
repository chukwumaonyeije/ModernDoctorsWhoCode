<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Three GitHub Projects Physicians Can Actually Finish</title>
  <desc id="desc">Three browser card panels showing distinct clinical tools: a guideline microsite, a counseling checklist, and a patient-facing explainer, each glowing in the DWC dark theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06111F"/>
      <stop offset="0.5" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 450) scale(280 380)">
      <stop stop-color="#1D4ED8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 450) scale(280 380)">
      <stop stop-color="#0EA5E9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1300 450) scale(280 380)">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="80" y1="0" x2="1520" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="cardGlow1" x="-15%" y="-10%" width="130%" height="120%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardGlow2" x="-15%" y="-10%" width="130%" height="120%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardGlow3" x="-15%" y="-10%" width="130%" height="120%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.22"/>
  <ellipse cx="300" cy="450" rx="280" ry="380" fill="url(#glow1)"/>
  <ellipse cx="800" cy="450" rx="280" ry="380" fill="url(#glow2)"/>
  <ellipse cx="1300" cy="450" rx="280" ry="380" fill="url(#glow3)"/>

  <!-- CARD 1: Guideline Microsite (blue accent) -->
  <g filter="url(#cardGlow1)">
    <rect x="80" y="140" width="440" height="580" rx="16" fill="#0D1829" stroke="#1D4ED8" stroke-width="2"/>
  </g>
  <!-- Browser chrome -->
  <rect x="80" y="140" width="440" height="48" rx="16" fill="#0F172A"/>
  <rect x="80" y="172" width="440" height="16" fill="#0F172A"/>
  <circle cx="114" cy="164" r="7" fill="#1E293B"/>
  <circle cx="138" cy="164" r="7" fill="#1E293B"/>
  <circle cx="162" cy="164" r="7" fill="#1E293B"/>
  <rect x="186" y="156" width="260" height="16" rx="8" fill="#1E293B"/>
  <!-- URL bar text -->
  <rect x="196" y="159" width="120" height="10" rx="5" fill="#1D4ED8" fill-opacity="0.5"/>
  <!-- Card label -->
  <text x="300" y="230" font-family="JetBrains Mono, monospace" font-size="14" fill="#38BDF8" fill-opacity="0.6" text-anchor="middle">PROJECT 01</text>
  <!-- Card title -->
  <rect x="110" y="244" width="280" height="16" rx="6" fill="#38BDF8" fill-opacity="0.7"/>
  <rect x="110" y="268" width="200" height="12" rx="5" fill="#1D4ED8" fill-opacity="0.5"/>
  <!-- Content lines simulating guideline page -->
  <rect x="110" y="306" width="380" height="10" rx="4" fill="#1E293B" fill-opacity="0.9"/>
  <rect x="110" y="322" width="360" height="10" rx="4" fill="#1E293B" fill-opacity="0.8"/>
  <rect x="110" y="338" width="320" height="10" rx="4" fill="#1E293B" fill-opacity="0.7"/>
  <!-- Divider -->
  <line x1="110" y1="362" x2="490" y2="362" stroke="#1D4ED8" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Criteria items (checklist-style) -->
  <rect x="110" y="376" width="14" height="14" rx="3" fill="#1D4ED8" fill-opacity="0.6"/>
  <rect x="132" y="379" width="200" height="9" rx="4" fill="#38BDF8" fill-opacity="0.4"/>
  <rect x="110" y="400" width="14" height="14" rx="3" fill="#1D4ED8" fill-opacity="0.6"/>
  <rect x="132" y="403" width="240" height="9" rx="4" fill="#1E293B" fill-opacity="0.7"/>
  <rect x="110" y="424" width="14" height="14" rx="3" fill="#38BDF8" fill-opacity="0.7"/>
  <path d="M113 431L117 435L121 427" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  <rect x="132" y="427" width="180" height="9" rx="4" fill="#38BDF8" fill-opacity="0.5"/>
  <rect x="110" y="448" width="14" height="14" rx="3" fill="#38BDF8" fill-opacity="0.7"/>
  <path d="M113 455L117 459L121 451" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  <rect x="132" y="451" width="220" height="9" rx="4" fill="#38BDF8" fill-opacity="0.4"/>
  <!-- Result badge -->
  <rect x="110" y="500" width="360" height="48" rx="10" fill="#1D4ED8" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="130" y="516" width="160" height="10" rx="4" fill="#38BDF8" fill-opacity="0.6"/>
  <rect x="130" y="532" width="100" height="8" rx="3" fill="#1D4ED8" fill-opacity="0.5"/>
  <!-- Bottom label -->
  <text x="300" y="670" font-family="JetBrains Mono, monospace" font-size="17" fill="#38BDF8" fill-opacity="0.55" text-anchor="middle">Guideline Microsite</text>

  <!-- CARD 2: Counseling Helper (cyan accent, center, slightly elevated) -->
  <g filter="url(#cardGlow2)">
    <rect x="580" y="100" width="440" height="640" rx="16" fill="#0D1829" stroke="#0EA5E9" stroke-width="2.5"/>
  </g>
  <!-- Browser chrome -->
  <rect x="580" y="100" width="440" height="48" rx="16" fill="#0F172A"/>
  <rect x="580" y="132" width="440" height="16" fill="#0F172A"/>
  <circle cx="614" cy="124" r="7" fill="#1E293B"/>
  <circle cx="638" cy="124" r="7" fill="#1E293B"/>
  <circle cx="662" cy="124" r="7" fill="#1E293B"/>
  <rect x="686" y="116" width="260" height="16" rx="8" fill="#1E293B"/>
  <rect x="696" y="119" width="140" height="10" rx="5" fill="#0EA5E9" fill-opacity="0.45"/>
  <!-- Card label -->
  <text x="800" y="186" font-family="JetBrains Mono, monospace" font-size="14" fill="#67E8F9" fill-opacity="0.7" text-anchor="middle">PROJECT 02</text>
  <!-- Card title -->
  <rect x="610" y="200" width="300" height="16" rx="6" fill="#67E8F9" fill-opacity="0.75"/>
  <rect x="610" y="224" width="220" height="12" rx="5" fill="#0EA5E9" fill-opacity="0.5"/>
  <!-- Tabs -->
  <rect x="610" y="254" width="100" height="28" rx="6" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="718" y="254" width="100" height="28" rx="6" fill="#1E293B" fill-opacity="0.5"/>
  <rect x="826" y="254" width="100" height="28" rx="6" fill="#1E293B" fill-opacity="0.5"/>
  <rect x="624" y="263" width="70" height="9" rx="3" fill="#38BDF8" fill-opacity="0.6"/>
  <rect x="730" y="263" width="70" height="9" rx="3" fill="#1E293B" fill-opacity="0.8"/>
  <rect x="838" y="263" width="70" height="9" rx="3" fill="#1E293B" fill-opacity="0.8"/>
  <!-- Content: structured counseling form -->
  <rect x="610" y="300" width="380" height="10" rx="4" fill="#1E293B" fill-opacity="0.9"/>
  <rect x="610" y="316" width="340" height="10" rx="4" fill="#1E293B" fill-opacity="0.8"/>
  <rect x="610" y="332" width="300" height="10" rx="4" fill="#1E293B" fill-opacity="0.7"/>
  <line x1="610" y1="356" x2="990" y2="356" stroke="#0EA5E9" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Checklist items -->
  <rect x="610" y="370" width="18" height="18" rx="4" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M614 379L618 383L622 375" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  <rect x="638" y="374" width="220" height="9" rx="4" fill="#67E8F9" fill-opacity="0.5"/>
  <rect x="610" y="400" width="18" height="18" rx="4" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M614 409L618 413L622 405" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  <rect x="638" y="404" width="260" height="9" rx="4" fill="#67E8F9" fill-opacity="0.45"/>
  <rect x="610" y="430" width="18" height="18" rx="4" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="638" y="434" width="200" height="9" rx="4" fill="#1E293B" fill-opacity="0.7"/>
  <rect x="610" y="460" width="18" height="18" rx="4" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="638" y="464" width="240" height="9" rx="4" fill="#1E293B" fill-opacity="0.7"/>
  <rect x="610" y="490" width="18" height="18" rx="4" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M614 499L618 503L622 495" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  <rect x="638" y="494" width="280" height="9" rx="4" fill="#67E8F9" fill-opacity="0.4"/>
  <!-- Output summary -->
  <rect x="610" y="528" width="380" height="80" rx="10" fill="#0B1E35" stroke="#0EA5E9" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="626" y="542" width="240" height="10" rx="4" fill="#67E8F9" fill-opacity="0.6"/>
  <rect x="626" y="558" width="200" height="8" rx="3" fill="#38BDF8" fill-opacity="0.4"/>
  <rect x="626" y="572" width="180" height="8" rx="3" fill="#0EA5E9" fill-opacity="0.35"/>
  <rect x="626" y="586" width="160" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>
  <!-- Copy button -->
  <rect x="820" y="546" width="140" height="36" rx="8" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="840" y="558" width="80" height="10" rx="4" fill="#67E8F9" fill-opacity="0.7"/>
  <!-- Bottom label -->
  <text x="800" y="698" font-family="JetBrains Mono, monospace" font-size="17" fill="#67E8F9" fill-opacity="0.65" text-anchor="middle">Counseling Helper</text>

  <!-- CARD 3: Patient-Facing Explainer (purple accent) -->
  <g filter="url(#cardGlow3)">
    <rect x="1080" y="140" width="440" height="580" rx="16" fill="#0D1829" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <!-- Browser chrome -->
  <rect x="1080" y="140" width="440" height="48" rx="16" fill="#0F172A"/>
  <rect x="1080" y="172" width="440" height="16" fill="#0F172A"/>
  <circle cx="1114" cy="164" r="7" fill="#1E293B"/>
  <circle cx="1138" cy="164" r="7" fill="#1E293B"/>
  <circle cx="1162" cy="164" r="7" fill="#1E293B"/>
  <rect x="1186" y="156" width="260" height="16" rx="8" fill="#1E293B"/>
  <rect x="1196" y="159" width="130" height="10" rx="5" fill="#7C3AED" fill-opacity="0.5"/>
  <!-- Card label -->
  <text x="1300" y="230" font-family="JetBrains Mono, monospace" font-size="14" fill="#A78BFA" fill-opacity="0.65" text-anchor="middle">PROJECT 03</text>
  <!-- Card title -->
  <rect x="1110" y="244" width="280" height="16" rx="6" fill="#A78BFA" fill-opacity="0.7"/>
  <rect x="1110" y="268" width="200" height="12" rx="5" fill="#7C3AED" fill-opacity="0.5"/>
  <!-- Patient-facing layout: simple card UI -->
  <rect x="1110" y="302" width="380" height="80" rx="10" fill="#0E1A2E" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="1126" y="318" width="200" height="12" rx="5" fill="#A78BFA" fill-opacity="0.6"/>
  <rect x="1126" y="336" width="280" height="9" rx="4" fill="#1E293B" fill-opacity="0.8"/>
  <rect x="1126" y="350" width="250" height="9" rx="4" fill="#1E293B" fill-opacity="0.7"/>
  <!-- Input row -->
  <rect x="1110" y="400" width="380" height="40" rx="8" fill="#0F172A" stroke="#4C1D95" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="1126" y="414" width="160" height="10" rx="4" fill="#1E293B" fill-opacity="0.7"/>
  <rect x="1390" y="410" width="80" height="22" rx="6" fill="#7C3AED" fill-opacity="0.5"/>
  <rect x="1400" y="418" width="60" height="8" rx="3" fill="#A78BFA" fill-opacity="0.7"/>
  <!-- Threshold display -->
  <rect x="1110" y="458" width="180" height="60" rx="10" fill="#16103A" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="1126" y="472" width="80" height="10" rx="4" fill="#A78BFA" fill-opacity="0.5"/>
  <rect x="1126" y="490" width="120" height="14" rx="5" fill="#A78BFA" fill-opacity="0.75"/>
  <rect x="1302" y="458" width="188" height="60" rx="10" fill="#0B1F1B" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="1318" y="472" width="80" height="10" rx="4" fill="#6EE7B7" fill-opacity="0.5"/>
  <rect x="1318" y="490" width="120" height="14" rx="5" fill="#10B981" fill-opacity="0.6"/>
  <!-- Call to action -->
  <rect x="1110" y="540" width="380" height="44" rx="10" fill="#6D28D9" fill-opacity="0.35" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="1220" y="556" width="160" height="12" rx="5" fill="#A78BFA" fill-opacity="0.75"/>
  <!-- Info row -->
  <rect x="1110" y="604" width="380" height="10" rx="4" fill="#1E293B" fill-opacity="0.7"/>
  <rect x="1110" y="620" width="320" height="10" rx="4" fill="#1E293B" fill-opacity="0.6"/>
  <!-- Bottom label -->
  <text x="1300" y="680" font-family="JetBrains Mono, monospace" font-size="17" fill="#A78BFA" fill-opacity="0.55" text-anchor="middle">Patient Explainer</text>

  <!-- Connecting arcs between cards -->
  <path d="M520 450 Q550 430 580 450" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  <path d="M1020 450 Q1050 430 1080 450" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>

  <!-- Background horizontal lines -->
  <g opacity="0.08">
    <line x1="60" y1="160" x2="1540" y2="160" stroke="#38BDF8" stroke-width="1"/>
    <line x1="60" y1="780" x2="1540" y2="780" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Bottom sweep -->
  <path d="M80 820C400 790 800 790 1200 810C1300 818 1400 818 1520 800" stroke="url(#cyanLine)" stroke-opacity="0.14" stroke-width="2"/>
</svg>
