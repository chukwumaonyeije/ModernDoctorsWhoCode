<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub for Physicians — Why Version Control Changes How You Build</title>
  <desc id="desc">A git branch tree visualization with commit nodes, branching paths, and merge points, rendered in the DWC dark navy palette with cyan and blue accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06111F"/>
      <stop offset="0.55" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowMain" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(750 450) scale(600 420)">
      <stop stop-color="#1A6FC4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1A6FC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBranch" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 280) scale(300 200)">
      <stop stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mainBranch" x1="160" y1="450" x2="1440" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="featureBranch" x1="400" y1="280" x2="1100" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hotfix" x1="800" y1="620" x2="1060" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigNodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.2"/>
  <ellipse cx="750" cy="450" rx="600" ry="420" fill="url(#glowMain)"/>
  <ellipse cx="900" cy="280" rx="300" ry="200" fill="url(#glowBranch)"/>

  <!-- MAIN BRANCH (horizontal, y=450) -->
  <line x1="120" y1="450" x2="1480" y2="450" stroke="url(#mainBranch)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>

  <!-- FEATURE BRANCH (arcs up to y=280) -->
  <!-- Branch out from commit C2 (x=420) up to feature, then back to C5 (x=1080) -->
  <path d="M420 450 C420 380 480 280 560 280" stroke="url(#featureBranch)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#lineGlow)" opacity="0.9"/>
  <line x1="560" y1="280" x2="980" y2="280" stroke="url(#featureBranch)" stroke-width="3" stroke-linecap="round" filter="url(#lineGlow)" opacity="0.9"/>
  <path d="M980 280 C1060 280 1080 360 1080 450" stroke="url(#featureBranch)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#lineGlow)" opacity="0.9"/>

  <!-- HOTFIX BRANCH (dips down to y=620) -->
  <path d="M800 450 C800 530 840 620 900 620" stroke="url(#hotfix)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#lineGlow)" opacity="0.85"/>
  <line x1="900" y1="620" x2="1060" y2="620" stroke="url(#hotfix)" stroke-width="2.5" stroke-linecap="round" filter="url(#lineGlow)" opacity="0.85"/>
  <path d="M1060 620 C1120 620 1140 530 1140 450" stroke="url(#hotfix)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#lineGlow)" opacity="0.85"/>

  <!-- MAIN BRANCH COMMITS -->
  <!-- C0: initial commit -->
  <g filter="url(#nodeGlow)">
    <circle cx="220" cy="450" r="16" fill="#0F172A" stroke="#1D4ED8" stroke-width="2.5"/>
    <circle cx="220" cy="450" r="7" fill="#1D4ED8"/>
  </g>
  <!-- C1 -->
  <g filter="url(#nodeGlow)">
    <circle cx="420" cy="450" r="16" fill="#0F172A" stroke="#1D4ED8" stroke-width="2.5"/>
    <circle cx="420" cy="450" r="7" fill="#1D4ED8"/>
  </g>
  <!-- C2: branch point -->
  <g filter="url(#nodeGlow)">
    <circle cx="620" cy="450" r="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="620" cy="450" r="7" fill="#38BDF8"/>
  </g>
  <!-- C3 -->
  <g filter="url(#nodeGlow)">
    <circle cx="800" cy="450" r="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="800" cy="450" r="7" fill="#38BDF8"/>
  </g>
  <!-- C4: merge point for hotfix -->
  <g filter="url(#nodeGlow)">
    <circle cx="1140" cy="450" r="16" fill="#0F172A" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="1140" cy="450" r="7" fill="#10B981"/>
  </g>
  <!-- C5: merge point for feature (main highlight) -->
  <g filter="url(#bigNodeGlow)">
    <circle cx="1080" cy="450" r="20" fill="#0F172A" stroke="#67E8F9" stroke-width="3"/>
    <circle cx="1080" cy="450" r="9" fill="#38BDF8"/>
  </g>
  <!-- HEAD -->
  <g filter="url(#bigNodeGlow)">
    <circle cx="1380" cy="450" r="22" fill="#0B1E3A" stroke="#67E8F9" stroke-width="3"/>
    <circle cx="1380" cy="450" r="10" fill="#67E8F9"/>
  </g>

  <!-- FEATURE BRANCH COMMITS -->
  <g filter="url(#nodeGlow)">
    <circle cx="660" cy="280" r="14" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="660" cy="280" r="6" fill="#A78BFA"/>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="800" cy="280" r="14" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="800" cy="280" r="6" fill="#A78BFA"/>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="940" cy="280" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="940" cy="280" r="6" fill="#38BDF8"/>
  </g>

  <!-- HOTFIX COMMITS -->
  <g filter="url(#nodeGlow)">
    <circle cx="940" cy="620" r="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <circle cx="940" cy="620" r="6" fill="#10B981"/>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="1020" cy="620" r="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <circle cx="1020" cy="620" r="6" fill="#10B981"/>
  </g>

  <!-- COMMIT LABELS -->
  <!-- Main branch -->
  <rect x="170" y="478" width="100" height="28" rx="6" fill="#0F172A" stroke="#1D4ED8" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="180" y="486" width="80" height="12" rx="4" fill="#1D4ED8" fill-opacity="0.5"/>

  <rect x="370" y="478" width="100" height="28" rx="6" fill="#0F172A" stroke="#1D4ED8" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="380" y="486" width="80" height="12" rx="4" fill="#1D4ED8" fill-opacity="0.5"/>

  <rect x="570" y="478" width="100" height="28" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="580" y="486" width="80" height="12" rx="4" fill="#38BDF8" fill-opacity="0.5"/>

  <!-- HEAD label -->
  <rect x="1330" y="404" width="100" height="28" rx="6" fill="#0F172A" stroke="#67E8F9" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1380" y="422" font-family="JetBrains Mono, monospace" font-size="16" fill="#67E8F9" fill-opacity="0.9" text-anchor="middle">HEAD</text>

  <!-- Branch name labels -->
  <rect x="80" y="430" width="110" height="24" rx="6" fill="#1D4ED8" fill-opacity="0.2" stroke="#1D4ED8" stroke-opacity="0.5" stroke-width="1"/>
  <text x="135" y="446" font-family="JetBrains Mono, monospace" font-size="14" fill="#38BDF8" fill-opacity="0.8" text-anchor="middle">main</text>

  <rect x="460" y="258" width="140" height="24" rx="6" fill="#6D28D9" fill-opacity="0.2" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1"/>
  <text x="530" y="274" font-family="JetBrains Mono, monospace" font-size="14" fill="#A78BFA" fill-opacity="0.85" text-anchor="middle">feature/v2</text>

  <rect x="820" y="636" width="130" height="24" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
  <text x="885" y="652" font-family="JetBrains Mono, monospace" font-size="14" fill="#6EE7B7" fill-opacity="0.85" text-anchor="middle">hotfix/bp</text>

  <!-- Commit message cards floating right -->
  <rect x="1200" y="200" width="280" height="70" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" opacity="0.8"/>
  <rect x="1220" y="216" width="200" height="10" rx="4" fill="#38BDF8" fill-opacity="0.55"/>
  <rect x="1220" y="232" width="160" height="8" rx="3" fill="#1E293B" fill-opacity="0.8"/>
  <rect x="1220" y="246" width="120" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>

  <rect x="1240" y="310" width="280" height="70" rx="10" fill="#0F172A" stroke="#67E8F9" stroke-opacity="0.4" stroke-width="1.5" opacity="0.8"/>
  <rect x="1260" y="326" width="220" height="10" rx="4" fill="#67E8F9" fill-opacity="0.5"/>
  <rect x="1260" y="342" width="160" height="8" rx="3" fill="#1E293B" fill-opacity="0.8"/>
  <rect x="1260" y="356" width="130" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>

  <rect x="1200" y="420" width="280" height="70" rx="10" fill="#0B1E3A" stroke="#67E8F9" stroke-opacity="0.6" stroke-width="1.5" opacity="0.9"/>
  <rect x="1220" y="436" width="240" height="10" rx="4" fill="#67E8F9" fill-opacity="0.7"/>
  <rect x="1220" y="452" width="180" height="8" rx="3" fill="#38BDF8" fill-opacity="0.4"/>
  <rect x="1220" y="466" width="140" height="8" rx="3" fill="#1E293B" fill-opacity="0.6"/>

  <!-- Dotted vertical time axis -->
  <line x1="160" y1="140" x2="160" y2="760" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Bottom floor -->
  <path d="M80 800C400 770 900 770 1400 790C1450 793 1500 793 1540 785" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2"/>
</svg>
