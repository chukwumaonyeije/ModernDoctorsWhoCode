<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stop Lurking — Why Physicians Should Start GitHub Before They Feel Ready</title>
  <desc id="desc">A dark illustration showing a threshold: a physician silhouette on the left in shadow, a luminous GitHub-style interface world on the right, with cyan light spilling through the gap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060D17"/>
      <stop offset="0.5" stop-color="#0B1525"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="doorGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 450) scale(320 500)">
      <stop stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#1A6FC4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0B1525" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 450) scale(360 480)">
      <stop stop-color="#0C2340" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#060D17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1200 420) scale(440 520)">
      <stop stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorFill" x1="700" y1="120" x2="900" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0B1525" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="800" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="largeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="doorBloom" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.22"/>
  <ellipse cx="300" cy="450" rx="360" ry="480" fill="url(#glowLeft)"/>
  <ellipse cx="1200" cy="420" rx="440" ry="520" fill="url(#glowRight)"/>

  <!-- Threshold / door glow bloom -->
  <rect x="772" y="100" width="56" height="760" rx="4" fill="url(#doorFill)" filter="url(#doorBloom)" opacity="0.9"/>

  <!-- Door frame -->
  <rect x="726" y="140" width="148" height="640" rx="6" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Door top arch suggestion -->
  <path d="M726 140 Q800 80 874 140" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Left side: physician silhouette (dark, in shadow) -->
  <!-- Head -->
  <ellipse cx="380" cy="308" rx="52" ry="60" fill="#0B1728" stroke="#1E3A5F" stroke-width="1.5" opacity="0.85"/>
  <!-- Body / coat -->
  <path d="M298 760C306 660 330 600 348 548C360 516 372 492 380 468C388 492 400 516 412 548C430 600 454 660 462 760H298Z" fill="#0B1728" stroke="#1E3A5F" stroke-width="1.5" opacity="0.85"/>
  <!-- Stethoscope hint -->
  <path d="M352 490C344 510 336 528 344 548C352 566 372 570 384 556" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Shadow cast right toward door -->
  <path d="M426 480L700 560L690 600L410 520Z" fill="#060D17" opacity="0.4"/>
  <path d="M440 580L720 700L710 740L428 620Z" fill="#060D17" opacity="0.3"/>

  <!-- Vertical cyan split line (the threshold) -->
  <line x1="800" y1="100" x2="800" y2="820" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>

  <!-- Right side: GitHub-style code world -->
  <!-- Floating commit cards -->
  <g opacity="0.82">
    <!-- Card 1 -->
    <rect x="880" y="180" width="300" height="78" rx="12" fill="#0F172A" stroke="#1E40AF" stroke-width="1.5"/>
    <circle cx="910" cy="219" r="10" fill="#1D4ED8" opacity="0.8"/>
    <path d="M904 219L908 223L916 215" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <rect x="930" y="206" width="180" height="10" rx="5" fill="#38BDF8" opacity="0.7"/>
    <rect x="930" y="224" width="120" height="8" rx="4" fill="#1D4ED8" opacity="0.5"/>
    <rect x="930" y="238" width="90" height="7" rx="3" fill="#1E293B" opacity="0.8"/>

    <!-- Card 2 -->
    <rect x="940" y="300" width="300" height="78" rx="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.5"/>
    <circle cx="970" cy="339" r="10" fill="#0284C7" opacity="0.8"/>
    <path d="M964 339L968 343L976 335" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
    <rect x="990" y="326" width="200" height="10" rx="5" fill="#67E8F9" opacity="0.65"/>
    <rect x="990" y="344" width="140" height="8" rx="4" fill="#38BDF8" opacity="0.45"/>
    <rect x="990" y="358" width="100" height="7" rx="3" fill="#1E293B" opacity="0.8"/>

    <!-- Card 3 -->
    <rect x="880" y="420" width="300" height="78" rx="12" fill="#0F172A" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="910" cy="459" r="10" fill="#6D28D9" opacity="0.8"/>
    <path d="M904 459L908 463L916 455" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <rect x="930" y="446" width="160" height="10" rx="5" fill="#A78BFA" opacity="0.65"/>
    <rect x="930" y="464" width="110" height="8" rx="4" fill="#7C3AED" opacity="0.5"/>
    <rect x="930" y="478" width="80" height="7" rx="3" fill="#1E293B" opacity="0.8"/>

    <!-- Card 4 -->
    <rect x="940" y="540" width="300" height="78" rx="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.5"/>
    <circle cx="970" cy="579" r="10" fill="#1D4ED8" opacity="0.8"/>
    <path d="M964 579L968 583L976 575" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <rect x="990" y="566" width="190" height="10" rx="5" fill="#38BDF8" opacity="0.6"/>
    <rect x="990" y="584" width="130" height="8" rx="4" fill="#67E8F9" opacity="0.4"/>
    <rect x="990" y="598" width="95" height="7" rx="3" fill="#1E293B" opacity="0.8"/>
  </g>

  <!-- Connecting lines between cards (commit graph) -->
  <g opacity="0.4" filter="url(#softGlow)">
    <line x1="910" y1="258" x2="970" y2="300" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="970" y1="378" x2="910" y2="420" stroke="#A78BFA" stroke-width="1.5"/>
    <line x1="910" y1="498" x2="970" y2="540" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- Right side horizontal data lines (far background) -->
  <g opacity="0.15">
    <path d="M1280 220H1540" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M1300 280H1560" stroke="#1D4ED8" stroke-width="1.5"/>
    <path d="M1280 340H1540" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M1260 400H1520" stroke="#1D4ED8" stroke-width="1.5"/>
    <path d="M1280 460H1540" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M1300 520H1560" stroke="#1D4ED8" stroke-width="1.5"/>
    <path d="M1280 580H1540" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M1260 640H1520" stroke="#A78BFA" stroke-width="1.5"/>
  </g>

  <!-- Glow nodes at door edge -->
  <g filter="url(#largeGlow)">
    <circle cx="800" cy="220" r="5" fill="#67E8F9"/>
    <circle cx="800" cy="360" r="4" fill="#38BDF8"/>
    <circle cx="800" cy="500" r="5" fill="#67E8F9"/>
    <circle cx="800" cy="640" r="4" fill="#A78BFA"/>
  </g>

  <!-- Left side: faint horizontal scan lines (dark world) -->
  <g opacity="0.08">
    <line x1="60" y1="260" x2="710" y2="260" stroke="#38BDF8" stroke-width="1"/>
    <line x1="60" y1="360" x2="710" y2="360" stroke="#38BDF8" stroke-width="1"/>
    <line x1="60" y1="460" x2="710" y2="460" stroke="#38BDF8" stroke-width="1"/>
    <line x1="60" y1="560" x2="710" y2="560" stroke="#38BDF8" stroke-width="1"/>
    <line x1="60" y1="660" x2="710" y2="660" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Floor line -->
  <path d="M80 760C340 730 600 730 800 760C1000 790 1300 790 1520 750" stroke="url(#cyanLine)" stroke-opacity="0.18" stroke-width="2"/>
</svg>
